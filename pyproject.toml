[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipiname"
version = "1.0.0"
description = "根据三才五格和古诗文生成中文双字名候选"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "NanBox" }]
dependencies = [
    "fastapi>=0.111,<1.0",
    "opencc-python-reimplemented>=0.1.7,<0.2",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
]

[project.scripts]
pipiname = "pipiname.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pipiname = ["data/*.sqlite3", "data/*.dat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
